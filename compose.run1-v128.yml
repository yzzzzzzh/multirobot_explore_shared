name: fishbot_dual_go2_v128

services:
  gazebo:
    container_name: fishbot_gazebo
    image: ${LEGGED_IMAGE:-fishbot_multirobot_sim-legged:run1-v128-historical}
    ipc: host
    tty: true
    privileged: true
    runtime: nvidia
    network_mode: host
    env_file:
      - ./docker/ros.env
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LEGGED_MIN_STEP_SPEED: ${LEGGED_MIN_STEP_SPEED:-0.0}
      LEGGED_PARK_WHEN_IDLE: ${LEGGED_PARK_WHEN_IDLE:-false}
      LEGGED_IDLE_PARK_SECONDS: ${LEGGED_IDLE_PARK_SECONDS:-3.0}
      LEGGED_MAX_LINEAR_ACCEL: ${LEGGED_MAX_LINEAR_ACCEL:-1.8}
      LEGGED_MAX_ANGULAR_ACCEL: ${LEGGED_MAX_ANGULAR_ACCEL:-1.0}
    volumes:
      - ./src/gazebo_sim:/fishbot_ws/src/gazebo_sim
      - ./src/legged/legged_sim:/legged_ws/src/legged_sim:ro
    command:
      - bash
      - -lc
      - >-
        export SPAWN_POSES='${QUADRUPED_SPAWN_POSES:-[[-4.0,0.0,0.46,0.0],[4.0,0.0,0.46,0.0]]}';
        export LEGGED_CONTROLLER=rl LEGGED_AUTO_TROT=false LEGGED_RL_MODEL=himloco;
        ros2 launch legged_sim legged_atrium.launch.py
        world:=/fishbot_ws/src/gazebo_sim/worlds/teaching_building_atrium_legged.world
        headless:=true count:=2
        vx_limit:=${LEGGED_VX_LIMIT:-1.2}
        vy_limit:=${LEGGED_VY_LIMIT:-0.8}
        wz_limit:=${LEGGED_WZ_LIMIT:-0.8}
        auto_trot:=false locomotion:=rl

  swarm_lio2:
    container_name: swarm_lio2_ros2
    image: ${SWARM_LIO_IMAGE:-swarm-lio2-ros2:run1-v128-validated}
    working_dir: /opt/swarm_lio_ws
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    runtime: nvidia
    environment:
      ROS_DOMAIN_ID: "0"
      DEBIAN_FRONTEND: noninteractive
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      RACER_BOTS: "1,2"
      RACER_ADAPTER_CONFIG: racer_adapter_quadruped_go2_dual.yaml
      SWARM_FORCE_UAV_NUM: "2"
      SWARM_ENABLE_MUTUAL_OBSERVATION_UPDATE: "true"
    volumes:
      - ./src/Swarm-LIO2-ROS2-Docker/src:/opt/swarm_lio_ws/src:rw
      - ./src/Swarm-LIO2-ROS2-Docker/bags:/opt/swarm_lio_ws/bags:ro
      - ./src/racer_adapter:/opt/swarm_lio_ws/src/racer_adapter:ro
      - ./src/racer_integration:/racer_integration:ro
    command:
      - bash
      - -lc
      - |
        set -e
        source /opt/ros/humble/setup.bash
        cd /opt/swarm_lio_ws
        colcon build --packages-select swarm_lio racer_adapter --cmake-args -DCMAKE_BUILD_TYPE=Release
        source install/setup.bash
        ros2 launch swarm_lio simulation.launch.py \
          bot_list:=1,2 rviz_list:=none use_sim_time:=true \
          ground_truth_logging_en:=false cluster_size_thresh:=1.2 \
          enable_mutual_observation_update:=true force_uav_num:=2 \
          cross_world_transform_mode:=se3 gravity_constrained_extrinsic_rotation:=true \
          max_abs_match_yaw_deg:=3.0 traj_matching_start_thresh:=1.0 \
          traj_matching_time_tolerance:=0.06 ave_match_error_thresh:=0.08 \
          temp_tracker_lost_timeout:=8.0 valid_temp_cluster_dist_thresh:=1.2 \
          use_raw_temp_measurement_for_traj_matching:=true \
          trajectory_samples_require_measurement:=true \
          stop_tracking_after_bootstrap:=false planar_odom_prior_en:=true \
          point_filter_num:=2 filter_size_surf:=0.2 filter_size_map:=0.3 \
          pcd_save_en:=false local_map_pub_en:=false &
        ros2 launch racer_adapter racer_frame_adapter.launch.py \
          config:=/opt/swarm_lio_ws/install/racer_adapter/share/racer_adapter/config/racer_adapter_quadruped_go2_dual.yaml &
        exec /usr/bin/python3 /racer_integration/ros2_racer_gateway.py \
          --bots 1,2 --host 127.0.0.1 --port 47100 \
          --planar-no-return-rays --raw-lidar-range 10.0 \
          --raw-lidar-horizontal-min -3.14159 --raw-lidar-horizontal-max 3.14159 \
          --raw-lidar-vertical-min -0.126 --raw-lidar-vertical-max 0.907 \
          --raw-lidar-target-elevation 0.0 --raw-lidar-max-range-margin 0.05 \
          --raw-lidar-match-tolerance 0.12 --ros-args -p use_sim_time:=true

  racer_ros1:
    container_name: racer_ros1
    image: ${RACER_IMAGE:-fishbot_multirobot_sim-racer_ros1:v128-dual-first-grid-bonus}
    network_mode: host
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: 127.0.0.1
      DISPLAY: ${DISPLAY:-:0}
      RACER_BOTS: "1,2"
      RACER_ENABLE_TRAJECTORY_SERVER: "true"
      RACER_AUTO_TRIGGER: "true"
      RACER_MAP_WARMUP_SECONDS: "8"
      RACER_PLANNER_MAX_VEL: "1.2"
      RACER_PLANNER_MAX_ACC: "0.6"
      RACER_MAP_SIZE_X: "102.0"
      RACER_MAP_SIZE_Y: "52.0"
      RACER_MAP_SIZE_Z: "0.25"
      RACER_MAP_RESOLUTION: "0.25"
      RACER_GROUND_HEIGHT: "0.50"
      RACER_BOX_MIN_X: "-50.0"
      RACER_BOX_MIN_Y: "-25.0"
      RACER_BOX_MIN_Z: "0.50"
      RACER_BOX_MAX_X: "50.0"
      RACER_BOX_MAX_Y: "25.0"
      RACER_BOX_MAX_Z: "0.75"
      RACER_OBSTACLES_INFLATION: "0.85"
      RACER_EUCLIDEAN_INFLATION: "true"
      RACER_USE_MEASURED_REPLAN_START: "true"
      RACER_MAX_RAY_LENGTH: "10.0"
      RACER_VIRTUAL_CEIL_HEIGHT: "0.74"
      RACER_VISUALIZATION_HEIGHT: "0.75"
      RACER_FRONTIER_MIN_CANDIDATE_CLEARANCE: "0.21"
      RACER_FRONTIER_CLUSTER_MIN: "6"
      RACER_FRONTIER_MIN_VISIB_NUM: "5"
      RACER_FRONTIER_WALL_GAP_MAX_CELLS: "2"
      RACER_FRONTIER_WALL_GAP_MIN_SUPPORT_CELLS: "1"
      RACER_PARTITIONING_GRID_SIZE: "10.0"
      RACER_PARTITIONING_GRID_SIZE_Z: "-1.0"
      RACER_PARTITIONING_MIN_UNKNOWN_RATIO: "0.10"
      RACER_EXACT_DRONE_GRID_DIST: "40.0"
      RACER_PARTITIONING_REQUIRE_FRONTIER: "false"
      RACER_PARTITIONING_EXCLUDE_VISITED_NO_FRONTIER: "true"
      RACER_KINO_MAX_SEARCH_TIME: "1.0"
      RACER_SENSOR_MODEL: lidar_3d
      RACER_LIDAR_MIN_ELEVATION: "-0.02"
      RACER_LIDAR_MAX_ELEVATION: "0.02"
      RACER_MIN_TRANSLATION_PROGRESS: "0.18"
      RACER_MIN_TARGET_EXECUTION_TIME: "8.0"
      RACER_CONSISTENCY_SIGN: "1.0"
      RACER_FIRST_GRID_BONUS: "6.0"
    volumes:
      - ./src/racer_integration:/racer_integration:ro
      - ./src/RACER/swarm_exploration/exploration_manager/launch:/racer_ws/src/RACER/swarm_exploration/exploration_manager/launch:ro
    command: ["/bin/bash", "/racer_integration/run_ros1_stack.sh"]

  racer_controller:
    container_name: racer_controller
    image: ${SWARM_LIO_IMAGE:-swarm-lio2-ros2:run1-v128-validated}
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    depends_on:
      swarm_lio2:
        condition: service_started
    environment:
      ROS_DOMAIN_ID: "0"
      RACER_BOTS: "1,2"
    volumes:
      - ./src/racer_integration:/racer_integration:ro
    command:
      - bash
      - -lc
      - >-
        set -e;
        source /opt/ros/humble/setup.bash;
        source /opt/swarm_lio_ws/install/setup.bash;
        exec /usr/bin/python3 /racer_integration/ros2_racer_controller.py --bots 1,2 --ros-args
        -p use_sim_time:=true -p platform_mode:=ground_omni
        -p max_horizontal_speed:=1.2 -p max_vertical_speed:=0.0
        -p max_yaw_rate:=0.8 -p max_command_acceleration:=0.6
        -p ground_heading_kp:=2.2 -p ground_turn_in_place_angle_deg:=35.0
        -p stuck_recovery_dwell:=20.0 -p stuck_recovery_displacement:=0.12
        -p stuck_recovery_duration:=2.0
        -p ground_obstacle_z_min:=-0.20 -p ground_obstacle_z_max:=0.60
        -p command_timeout:=1.0 -p odom_timeout:=1.5 -p attitude_timeout:=1.0
        -p require_safety_monitor:=true
        -p bounds_lower:='[-50.0,-25.0,0.0]' -p bounds_upper:='[50.0,25.0,3.0]'
        -p bootstrap_root_only:=true -p bootstrap_radii:='[3.0]'
        -p bootstrap_directions_deg:='[90.0]'
        -p bootstrap_ground_lateral_scale:=0.7 -p bootstrap_loop_seconds:=40.0
        -p bootstrap_min_excitation_seconds:=47.0
        -p bootstrap_climb_height:=0.0 -p bootstrap_vertical_amplitude:=0.0
        -p separation_activation_distance:=2.5 -p separation_hard_distance:=1.4
        -p separation_repulsion_speed:=0.8 -p lidar_point_stride:=1
        -p lidar_to_body_z:=0.095 -p lidar_self_filter_radius:=0.35
        -p lidar_self_filter_z_min:=-0.50 -p lidar_self_filter_z_max:=0.50
        -p obstacle_corridor_radius:=0.58 -p obstacle_hard_clearance:=0.50
        -p obstacle_braking_margin:=0.50 -p obstacle_deceleration:=1.5
        -p obstacle_repulsion_activation:=1.45 -p obstacle_repulsion_speed:=0.5
